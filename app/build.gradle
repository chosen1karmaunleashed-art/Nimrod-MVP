plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// Keys are read from local.properties (gitignored) or the environment.
// Nothing secret is ever written into the build script.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localProps.load(new FileInputStream(localFile))
}

def openAiKey = localProps.getProperty('OPENAI_API_KEY') ?: System.getenv('OPENAI_API_KEY') ?: ''
def picoKey = localProps.getProperty('PICOVOICE_ACCESS_KEY') ?: System.getenv('PICOVOICE_ACCESS_KEY') ?: ''

android {
    namespace 'com.example.nimrod'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.nimrod"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey}\""
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", "\"${picoKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    implementation "ai.picovoice:porcupine-android:3.0.0"
    implementation "ai.picovoice:android-voice-processor:3.0.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
